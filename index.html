<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RobinLinks — Dashboard</title><style>
:root{--bg:#0b1220;--card:#142036;--border:#293a52;--text:#f3f7ff;--muted:#a1b0c7;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px}header,.flex,.buttons{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{margin-bottom:24px}.logo{font-size:26px;font-weight:800}.logo span,a{color:var(--blue)}.card,.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{margin:0}.stat strong{display:block;font-size:27px}.stat small,.muted{color:var(--muted)}h2{margin:0 0 16px}label{display:block;margin-bottom:5px;font-weight:600}input{width:100%;padding:11px;border-radius:8px;background:#0b1526;color:white;border:1px solid var(--border);font:inherit}input[type=checkbox]{width:auto}.field{margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:650}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--blue);color:#061321}.secondary{background:#293b55;color:white}.danger{background:#582b3a;color:white}.google{background:white;color:#222}.buttons{justify-content:flex-start}.row{border-bottom:1px solid var(--border);padding:16px 0}.row:last-child{border-bottom:0}.url{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.row a{overflow-wrap:anywhere}.hidden{display:none!important}.notice{min-height:28px;color:#86efac}.error{color:#fda4af}.chart{display:flex;align-items:flex-end;gap:8px;height:160px}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px}.bar{width:80%;max-width:42px;background:var(--blue);min-height:2px}table{border-collapse:collapse;width:100%}td{padding:8px;border-bottom:1px solid var(--border)}canvas{background:white;max-width:100%;padding:10px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr;gap:0}.card{padding:16px}}

.counter{font-size:13px;color:#a1b0c7}.error{color:#fda4af}.notice{min-height:24px}.row{border-bottom:1px solid #293a52;padding:16px 0}.url{overflow-wrap:anywhere}.row a{overflow-wrap:anywhere;color:#38bdf8}.buttons{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}</style></head><body><main>
<header><div class="logo">Robin<span>Links.</span></div><div id="account" class="buttons hidden"><span id="username" class="muted"></span><button id="logout" class="secondary">Sign out</button></div></header>
<section id="welcome" class="card"><h1>Free custom URL shortener</h1><p class="muted">Sign in with Google to create short links.</p><button id="login" class="google">Continue with Google</button></section>
<div id="dashboard" class="hidden"><div class="stats"><div class="stat"><strong id="totalLinks">0</strong><small>Total links</small></div><div class="stat"><strong id="totalClicks">0</strong><small>Recorded clicks</small></div><div class="stat"><strong id="activeLinks">0</strong><small>Active links</small></div></div>
<section class="card"><h2 id="formTitle">Create short link</h2><form id="linkForm"><div class="field"><label for="url">Destination URL</label><input id="url" type="url" maxlength="4096" placeholder="https://example.com" required><div id="preview" class="muted"></div><div id="duplicate" class="muted"></div></div><div class="grid"><div class="field"><label for="alias">Custom alias</label><input id="alias" maxlength="60" placeholder="my-link" required></div><div class="field"><label for="title">Title</label><input id="title" maxlength="100" placeholder="My website"></div><div class="field"><label for="expires">Expiration (optional)</label><input id="expires" type="datetime-local"></div></div><div class="field"><label><input id="enabled" type="checkbox" checked> Enabled</label></div><div class="buttons"><button id="save" class="primary" type="submit">Create link</button><button id="cancel" type="button" class="secondary hidden">Cancel edit</button></div></form></section>
<section class="card"><div class="flex"><h2>My short links</h2><button id="refresh" class="secondary">Refresh</button></div><div class="field"><input id="search" type="search" placeholder="Search your links"></div><div id="list"></div></section></div><p id="notice" class="notice" role="status"></p></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,query,where,getDocs,doc,getDoc,setDoc,updateDoc,deleteDoc,serverTimestamp,getCountFromServer} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const BASE='https://ik-robin.github.io/go/s/';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);
let user=null,records=[],editing=null,session=0;
const short=a=>BASE+encodeURIComponent(a);
function notice(message,error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error)}
function validUrl(s){try{return ['http:','https:'].includes(new URL(s).protocol)&&s.length<=4096}catch{return false}}
function date(v){return v?.toDate?v.toDate():v?new Date(v):null}
function active(r){return r.enabled!==false&&(!date(r.expiresAt)||date(r.expiresAt)>new Date())}
function reset(){editing=null;$('linkForm').reset();$('enabled').checked=true;$('alias').disabled=false;$('formTitle').textContent='Create short link';$('save').textContent='Create link';$('cancel').classList.add('hidden');$('preview').textContent='';$('duplicate').textContent=''}
$('login').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){notice(e.message,true)}};
$('logout').onclick=()=>signOut(auth);$('cancel').onclick=reset;$('refresh').onclick=load;
onAuthStateChanged(auth,async u=>{user=u;session++;records=[];reset();$('welcome').classList.toggle('hidden',!!u);$('dashboard').classList.toggle('hidden',!u);$('account').classList.toggle('hidden',!u);if(u){$('username').textContent=u.displayName||u.email;await load()}else{$('list').replaceChildren();notice('')}});
async function load(){if(!user)return;const uid=user.uid,version=session;try{const snap=await getDocs(query(collection(db,'links'),where('ownerUid','==',uid)));if(version!==session)return;records=snap.docs.map(d=>({alias:d.id,...d.data(),clickCount:0})).sort((a,b)=>a.alias.localeCompare(b.alias));render();await Promise.all(records.map(async r=>{try{const count=await getCountFromServer(collection(db,'links',r.alias,'clickEvents'));if(version!==session)return;r.clickCount=count.data().count}catch(e){console.warn('Click count unavailable for '+r.alias,e)}}));if(version===session)render()}catch(e){notice('Unable to load links: '+e.message,true)}}
$('url').oninput=()=>{const value=$('url').value.trim();$('preview').textContent=validUrl(value)?'Destination domain: '+new URL(value).hostname:'';const match=records.find(r=>r.url===value&&r.alias!==editing);$('duplicate').textContent=match?'You already shortened this URL: '+short(match.alias):''};
$('linkForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const alias=$('alias').value.trim(),url=$('url').value.trim(),title=$('title').value.trim(),expiry=$('expires').value;if(!/^[A-Za-z0-9_-]{1,60}$/.test(alias))return notice('Alias may contain only letters, numbers, hyphens and underscores (1–60 characters).',true);if(!validUrl(url))return notice('Enter a valid HTTP/HTTPS URL.',true);let expiresAt=null;if(expiry){const d=new Date(expiry);if(!Number.isFinite(d.getTime()))return notice('Invalid expiration date.',true);expiresAt=d.toISOString()}const ref=doc(db,'links',alias);$('save').disabled=true;try{if(editing){await updateDoc(ref,{url,title,enabled:$('enabled').checked,expiresAt,updatedAt:serverTimestamp()})}else{const existing=await getDoc(ref);if(existing.exists())return notice('This alias is already taken. Choose another one.',true);await setDoc(ref,{url,title,ownerUid:user.uid,enabled:$('enabled').checked,expiresAt,createdAt:serverTimestamp(),clicks:0})}reset();await load();notice('Saved: '+short(alias))}catch(err){console.error('Save failed',err);notice(err.code==='permission-denied'?'Firestore denied this operation. Publish the included firestore.rules, or choose another alias if it already exists.':err.message,true)}finally{$('save').disabled=false}};
function btn(label,css,fn){const b=document.createElement('button');b.type='button';b.className=css;b.textContent=label;b.onclick=fn;return b}
function render(){const list=$('list');list.replaceChildren();const filter=$('search').value.toLowerCase();$('totalLinks').textContent=records.length;$('totalClicks').textContent=records.reduce((n,r)=>n+(r.clickCount||0),0).toLocaleString();$('activeLinks').textContent=records.filter(active).length;const found=records.filter(r=>[r.alias,r.title||'',r.url||''].some(s=>s.toLowerCase().includes(filter)));if(!found.length){list.textContent='No links found.';return}for(const r of found){const row=document.createElement('div');row.className='row';const name=document.createElement('strong');name.textContent=r.title||r.alias;const link=document.createElement('a');link.href=short(r.alias);link.target='_blank';link.rel='noopener noreferrer';link.textContent=short(r.alias);const original=document.createElement('div');original.className='url';original.textContent=r.url;const meta=document.createElement('p');meta.className='counter';meta.textContent=`${active(r)?'Active':'Inactive'} · ${r.clickCount||0} recorded clicks`;const buttons=document.createElement('div');buttons.className='buttons';buttons.append(btn('Copy','secondary',async()=>{try{await navigator.clipboard.writeText(short(r.alias));notice('Copied')}catch{notice('Copy failed',true)}}),btn('Edit','secondary',()=>{editing=r.alias;$('alias').value=r.alias;$('alias').disabled=true;$('url').value=r.url;$('title').value=r.title||'';$('enabled').checked=r.enabled!==false;const d=date(r.expiresAt);$('expires').value=d?new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16):'';$('formTitle').textContent='Edit short link';$('save').textContent='Save changes';$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}),btn('Delete','danger',async()=>{if(!confirm('Delete '+r.alias+'?'))return;try{await deleteDoc(doc(db,'links',r.alias));if(editing===r.alias)reset();await load();notice('Link deleted. Previous click events may remain in Firestore.') }catch(e){notice(e.message,true)}}));row.append(name,document.createElement('br'),link,original,meta,buttons);list.append(row)}}$('search').oninput=render;
</script></body></html>
