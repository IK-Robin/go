
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RobinLinks — Admin</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0b1220;
  --panel:#142036;
  --border:#2a3b54;
  --text:#f1f5fb;
  --muted:#a0aec3;
  --accent:#38bdf8;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.5 system-ui,sans-serif;
}
main {max-width:960px;margin:auto;padding:28px 16px}
header {
  display:flex;align-items:center;
  justify-content:space-between;gap:12px;
  margin-bottom:28px;flex-wrap:wrap;
}
h1 {font-size:26px;margin:0}
h1 span {color:var(--accent)}
h2 {font-size:19px;margin:0 0 18px}
p {color:var(--muted)}
.card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:22px;margin-bottom:20px;
}
label {display:block;margin:0 0 7px;font-weight:600}
input {
  display:block;width:100%;
  padding:12px;background:#0b1526;
  border:1px solid var(--border);
  border-radius:9px;color:white;
  font:inherit;min-width:0;
}
input:focus {outline:2px solid var(--accent)}
.field {margin-bottom:17px}
.grid {display:grid;grid-template-columns:1fr 1fr;gap:15px}
button {
  border:0;border-radius:9px;
  padding:11px 16px;cursor:pointer;
  font:inherit;font-weight:650;
}
.primary {background:var(--accent);color:#061320}
.secondary {background:#2b3d56;color:white}
.danger {background:#542737;color:#ffd5dc}
.actions {display:flex;gap:8px;flex-wrap:wrap}
.row {
  display:flex;align-items:center;
  justify-content:space-between;gap:12px;
  padding:16px 0;border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.row:last-child {border-bottom:0}
.details {flex:1;min-width:200px;overflow-wrap:anywhere}
.details a {color:var(--accent);font-weight:700}
.small {font-size:12px;color:var(--muted)}
.hidden {display:none!important}
#message {margin:12px 0;color:#86efac;overflow-wrap:anywhere}
#error {color:#fda4af}
#search {margin-bottom:12px}
@media(max-width:600px) {
  .grid {grid-template-columns:1fr;gap:0}
  .card {padding:16px}
}
</style>
</head>
<body>
<main>
<header>
  <h1>Robin<span>Links</span></h1>
  <button id="logout" class="secondary hidden">Logout</button>
</header>

<section id="loginPanel" class="card">
  <h2>Admin Login</h2>
  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input id="email" type="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" required>
    </div>
    <button class="primary">Sign In</button>
  </form>
</section>

<div id="dashboard" class="hidden">
  <section class="card">
    <h2 id="formTitle">Create Short Link</h2>
    <form id="linkForm">
      <div class="field">
        <label>Destination URL</label>
        <input id="destination" type="url"
          placeholder="https://example.com/page"
          required>
      </div>
      <div class="grid">
        <div class="field">
          <label>Custom Alias</label>
          <input id="alias"
            placeholder="rvai"
            pattern="[A-Za-z0-9_-]{1,60}"
            maxlength="60" required>
        </div>
        <div class="field">
          <label>Title</label>
          <input id="title" maxlength="100"
            placeholder="RV AI Demo">
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="saveBtn">Save Link</button>
        <button type="button" id="cancelBtn"
          class="secondary hidden">Cancel Edit</button>
      </div>
    </form>
    <div id="message" role="status"></div>
  </section>

  <section class="card">
    <h2>Manage Links</h2>
    <input id="search" type="search"
      placeholder="Search links...">
    <div id="links"></div>
  </section>
</div>
<p id="error" role="alert"></p>
</main>

<script type="module">
import {initializeApp} from
  "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,collection,doc,
  getDocs,setDoc,updateDoc,deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

import {firebaseConfig} from "./firebase-config.js";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const collectionRef=collection(db,"links");
const $=id=>document.getElementById(id);
const BASE="https://ik-robin.github.io/go/s/";

let records=[];
let editing=null;

function validUrl(value) {
  try {
    const url=new URL(value);
    return ["http:","https:"].includes(url.protocol);
  } catch {return false}
}

function notify(text,isError=false) {
  $(isError?"error":"message").textContent=text;
  if(isError) $("message").textContent="";
  else $("error").textContent="";
}

function resetForm() {
  editing=null;
  $("linkForm").reset();
  $("alias").disabled=false;
  $("formTitle").textContent="Create Short Link";
  $("cancelBtn").classList.add("hidden");
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try {
    await signInWithEmailAndPassword(
      auth,$("email").value,$("password").value
    );
    $("password").value="";
  } catch(error) {
    notify(error.message,true);
  }
});

$("logout").onclick=()=>signOut(auth);
$("cancelBtn").onclick=resetForm;

onAuthStateChanged(auth,async user=>{
  $("loginPanel").classList.toggle("hidden",!!user);
  $("dashboard").classList.toggle("hidden",!user);
  $("logout").classList.toggle("hidden",!user);
  records=[];
  if(user) await loadLinks();
});

async function loadLinks() {
  try {
    const snapshot=await getDocs(collectionRef);
    records=snapshot.docs.map(d=>({
      alias:d.id,...d.data()
    }));
    render();
  } catch(error) {
    notify("Unable to load links: "+error.message,true);
  }
}

$("linkForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const alias=$("alias").value.trim();
  const url=$("destination").value.trim();
  const title=$("title").value.trim();

  if(!/^[A-Za-z0-9_-]{1,60}$/.test(alias) ||
     !validUrl(url)) {
    notify("Enter a valid alias and HTTP/HTTPS URL.",true);
    return;
  }

  const button=$("saveBtn");
  button.disabled=true;

  try {
    const ref=doc(db,"links",alias);

    if(editing) {
      await updateDoc(ref,{
        url,title,updatedAt:serverTimestamp()
      });
    } else {
      // This check is convenient for the dashboard.
      // Firestore rules also prevent overwriting existing aliases.
      const exists=records.some(r=>r.alias===alias);
      if(exists) throw new Error("Alias already exists.");

      await setDoc(ref,{
        url,title,createdAt:serverTimestamp()
      });
    }

    resetForm();
    await loadLinks();
    notify("Link saved! "+BASE+alias);
  } catch(error) {
    notify(error.message,true);
  } finally {
    button.disabled=false;
  }
});

function makeButton(label,css,callback) {
  const b=document.createElement("button");
  b.type="button";
  b.className=css;
  b.textContent=label;
  b.onclick=callback;
  return b;
}

function render() {
  const query=$("search").value.toLowerCase();
  const container=$("links");
  container.replaceChildren();

  const filtered=records.filter(r=>
    [r.alias,r.url,r.title||""]
      .some(v=>v.toLowerCase().includes(query))
  );

  if(!filtered.length) {
    const p=document.createElement("p");
    p.textContent="No links found.";
    container.append(p);
    return;
  }

  for(const record of filtered) {
    const row=document.createElement("div");
    row.className="row";

    const details=document.createElement("div");
    details.className="details";

    const a=document.createElement("a");
    a.href=BASE+record.alias;
    a.target="_blank";
    a.rel="noopener noreferrer";
    a.textContent=BASE+record.alias;

    const title=document.createElement("div");
    title.textContent=record.title||record.alias;

    const original=document.createElement("div");
    original.className="small";
    original.textContent=record.url;

    details.append(title,a,original);

    const actions=document.createElement("div");
    actions.className="actions";

    actions.append(
      makeButton("Copy","secondary",async()=>{
        try {
          await navigator.clipboard.writeText(BASE+record.alias);
          notify("Copied!");
        } catch {
          notify("Unable to copy link.",true);
        }
      }),
      makeButton("Edit","secondary",()=>{
        editing=record.alias;
        $("alias").value=record.alias;
        $("alias").disabled=true;
        $("destination").value=record.url;
        $("title").value=record.title||"";
        $("formTitle").textContent="Edit Short Link";
        $("cancelBtn").classList.remove("hidden");
        window.scrollTo({top:0,behavior:"smooth"});
      }),
      makeButton("Delete","danger",async()=>{
        if(!confirm("Delete "+record.alias+"?")) return;
        try {
          await deleteDoc(doc(db,"links",record.alias));
          if(editing===record.alias) resetForm();
          await loadLinks();
          notify("Link deleted.");
        } catch(error) {
          notify(error.message,true);
        }
      })
    );

    row.append(details,actions);
    container.append(row);
  }
}

$("search").addEventListener("input",render);
</script>
</body>
</html>
