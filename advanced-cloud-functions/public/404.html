<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Loading...</title><style>body{font:15px system-ui;min-height:100vh;margin:0;display:grid;place-items:center;color:#64748b;background:white}.box{text-align:center;padding:24px;max-width:340px}.spin{width:30px;height:30px;margin:0 auto 16px;border:3px solid #ddd;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:8px}input{border:1px solid #cbd5e1}button{border:0;background:#2563eb;color:white;cursor:pointer}[hidden]{display:none!important}.error{color:#b91c1c}</style></head><body><div class="box"><div id="spin" class="spin"></div><p id="status">Loading...</p><form id="form" hidden><h2>Password required</h2><input id="password" type="password" autocomplete="off" placeholder="Enter link password" required><button id="submit">Continue</button></form></div><script>
// CHANGE this to your deployed Firebase function base URL.
const API='https://asia-southeast1-link-shortener-288ce.cloudfunctions.net';
const $=id=>document.getElementById(id);const prefix='/go/s/';let alias='';
function error(message){$('spin').hidden=true;$('status').textContent=message;$('status').className='error';document.title='Link unavailable'}
async function resolve(password=''){if(!alias)return;$('status').textContent='Loading...';$('status').className='';try{const response=await fetch(API+'/resolveLink',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({alias,password})});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to open link');if(data.passwordRequired){$('spin').hidden=true;$('status').textContent='';$('form').hidden=false;document.title='Protected link';return}const dest=new URL(data.destination);if(!['http:','https:'].includes(dest.protocol))throw Error('Invalid destination');location.replace(dest.href)}catch(e){error(e.message)}}
try{if(!location.pathname.startsWith(prefix))throw Error('Invalid short link');alias=decodeURIComponent(location.pathname.slice(prefix.length).replace(/\/$/,''));if(!/^[A-Za-z0-9_-]{1,60}$/.test(alias))throw Error('Invalid alias');resolve()}catch(e){error(e.message)}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;await resolve($('password').value);$('submit').disabled=false});
</script></body></html>
