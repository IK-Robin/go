
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirect</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
}
</style>
</head>

<body>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

// IMPORTANT: Absolute path from GitHub Pages root
import { firebaseConfig } from "/go/firebase-config.js";

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function redirect() {

  try {

    // Example:
    // https://ik-robin.github.io/go/s/rvai1

    const path = window.location.pathname;

    const prefix = "/go/s/";

    if (!path.startsWith(prefix)) {
      window.location.replace("/go/");
      return;
    }

    // Get custom alias
    const alias = decodeURIComponent(
      path.substring(prefix.length).replace(/\/$/, "")
    );

    // Validate alias
    if (!/^[a-zA-Z0-9_-]{1,60}$/.test(alias)) {
      window.location.replace("/go/");
      return;
    }

    console.log("Short URL alias:", alias);

    // Fetch destination from Firestore
    const linkRef = doc(db, "links", alias);

    const snapshot = await getDoc(linkRef);

    if (!snapshot.exists()) {
      console.error("Short URL not found:", alias);
      window.location.replace("/go/");
      return;
    }

    const data = snapshot.data();

    if (!data.url) {
      console.error("Destination URL missing");
      window.location.replace("/go/");
      return;
    }

    // Validate destination
    const destination = new URL(data.url);

    if (
      destination.protocol !== "https:" &&
      destination.protocol !== "http:"
    ) {
      throw new Error("Invalid destination URL");
    }

    // Direct redirect without intermediate UI
    window.location.replace(destination.href);

  } catch (error) {

    console.error("RobinLinks Redirect Error:", error);

    // Fallback to dashboard
    window.location.replace("/go/");

  }

}

redirect();

</script>

</body>
</html>
