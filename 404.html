
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Loading...</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;
  align-items:center;justify-content:center;
  background:#fff;color:#64748b;
  font:15px/1.5 system-ui,sans-serif;
  padding:20px
}
.box{text-align:center;width:100%;max-width:350px}
.spinner{
  width:32px;height:32px;border:3px solid #e2e8f0;
  border-top-color:#2563eb;border-radius:50%;
  margin:0 auto 16px;animation:spin .7s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
input{
  width:100%;padding:12px;border:1px solid #cbd5e1;
  border-radius:8px;margin:12px 0;font:inherit
}
button{
  background:#2563eb;color:white;border:0;
  border-radius:8px;padding:12px 18px;
  cursor:pointer;width:100%;font:inherit
}
button:disabled{opacity:.6}
.hidden{display:none}
.error{color:#dc2626}
</style>
</head>
<body>
<div class="box">
  <div id="spinner" class="spinner"></div>
  <p id="status">Loading...</p>

  <form id="passwordForm" class="hidden">
    <h2>Protected Link</h2>
    <p>Enter the password to continue.</p>
    <input id="password" type="password"
      placeholder="Link password" required>
    <button id="unlockBtn" type="submit">Continue</button>
  </form>
</div>

<script>
const FUNCTION_BASE =
  "https://asia-southeast1-YOUR_PROJECT_ID.cloudfunctions.net";

const $=id=>document.getElementById(id);

function fail(message){
  $("spinner").classList.add("hidden");
  $("status").textContent=message;
  $("status").classList.add("error");
  document.title="Link unavailable";
}

const prefix="/go/s/";
const path=location.pathname;

let alias="";

try{
  if(!path.startsWith(prefix))throw Error("Invalid link");
  alias=decodeURIComponent(
    path.slice(prefix.length).replace(/\/$/,"")
  );
  if(!/^[A-Za-z0-9_-]{1,60}$/.test(alias)){
    throw Error("Invalid alias");
  }
}catch(e){
  fail(e.message);
}

async function resolve(password=""){
  if(!alias)return;

  $("status").textContent="Loading...";
  $("status").classList.remove("error");

  try{
    const response=await fetch(
      FUNCTION_BASE+"/resolveLink",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({alias,password})
      }
    );

    const data=await response.json();

    if(!response.ok){
      throw Error(data.error||"Unable to open link");
    }

    if(data.passwordRequired){
      $("spinner").classList.add("hidden");
      $("status").textContent="";
      $("passwordForm").classList.remove("hidden");
      document.title="Protected Link";
      return;
    }

    const destination=new URL(data.destination);

    if(!["http:","https:"].includes(destination.protocol)){
      throw Error("Invalid destination");
    }

    window.location.replace(destination.href);

  }catch(e){
    fail(e.message);
    if(!$("passwordForm").classList.contains("hidden")){
      $("status").textContent=e.message;
    }
  }
}

$("passwordForm").onsubmit=async e=>{
  e.preventDefault();
  $("unlockBtn").disabled=true;
  try{
    await resolve($("password").value);
  }finally{
    $("unlockBtn").disabled=false;
  }
};

resolve();
</script>
</body>
</html>
