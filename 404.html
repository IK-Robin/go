
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Loading...</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  color: #64748b;
  font-family: Arial, sans-serif;
}

.loading {
  text-align: center;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #e2e8f0;
  border-top-color: #2563eb;
  border-radius: 50%;
  margin: 0 auto 15px;
  animation: spin .7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading p {
  font-size: 14px;
  margin: 0;
}

.error {
  color: #dc2626;
}
</style>
</head>

<body>

<div class="loading">
  <div class="spinner" id="spinner"></div>
  <p id="status">Loading...</p>
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

// Firebase config from GitHub repository root
import { firebaseConfig } from "/go/firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const status = document.getElementById("status");
const spinner = document.getElementById("spinner");

function showError(message) {
  spinner.style.display = "none";
  status.textContent = message;
  status.classList.add("error");
  document.title = "Link unavailable";
}

async function redirect() {
  try {
    const prefix = "/go/s/";
    const path = window.location.pathname;

    if (!path.startsWith(prefix)) {
      showError("Invalid short link.");
      return;
    }

    const alias = decodeURIComponent(
      path.slice(prefix.length).replace(/\/$/, "")
    );

    if (!/^[A-Za-z0-9_-]{1,60}$/.test(alias)) {
      showError("Invalid link alias.");
      return;
    }

    const linkRef = doc(db, "links", alias);
    const snapshot = await getDoc(linkRef);

    if (!snapshot.exists()) {
      showError("This short link was not found.");
      return;
    }

    const destination = snapshot.data().url;
    const url = new URL(destination);

    if (!["http:", "https:"].includes(url.protocol)) {
      throw new Error("Invalid destination");
    }

    // Automatically redirect in the same tab
    window.location.replace(url.href);

  } catch (error) {
    console.error("Redirect error:", error);
    showError("Unable to open this link. Please try again.");
  }
}

redirect();

</script>

</body>
</html>
