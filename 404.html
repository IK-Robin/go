<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Loading...</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px system-ui;color:#64748b}.box{text-align:center}.spin{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;margin:auto;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{color:#dc2626}</style></head><body><div class="box"><div id="spin" class="spin"></div><p id="status">Loading...</p></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getFirestore,doc,getDoc,collection,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig} from '/go/firebase-config.js';
const status=document.getElementById('status');function fail(s){document.getElementById('spin').style.display='none';status.textContent=s;status.className='error';document.title='Link unavailable'}
try{const prefix='/go/s/';if(!location.pathname.startsWith(prefix))throw Error('Invalid link');const alias=decodeURIComponent(location.pathname.slice(prefix.length).replace(/\/$/,'')).trim();if(!/^[A-Za-z0-9_-]{1,60}$/.test(alias))throw Error('Invalid alias');const db=getFirestore(initializeApp(firebaseConfig));const snap=await getDoc(doc(db,'links',alias));if(!snap.exists())throw Error('Link not found');const data=snap.data();if(data.enabled===false)throw Error('This link is disabled');if(data.expiresAt){const d=data.expiresAt.toDate?data.expiresAt.toDate():new Date(data.expiresAt);if(d.getTime()<=Date.now())throw Error('This link has expired')}const target=new URL(data.url);if(!['http:','https:'].includes(target.protocol))throw Error('Invalid destination');
// Best-effort click event: redirect after success, failure, or a short timeout.
// This is not tamper-resistant and is not guaranteed to count every visit.
const write=addDoc(collection(db,'links',alias,'clickEvents'),{at:serverTimestamp()}).catch(e=>console.warn('Click event not recorded:',e));await Promise.race([write,new Promise(resolve=>setTimeout(resolve,900))]);location.replace(target.href);
}catch(e){console.error(e);fail(e.code==='permission-denied'?'Firestore access denied. Check published rules.':e.message||'Unable to redirect')}
</script></body></html>
