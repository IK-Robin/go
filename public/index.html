<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RobinLinks — Dashboard</title><style>
:root{--bg:#0b1220;--card:#142036;--border:#293a52;--text:#f3f7ff;--muted:#a1b0c7;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px}header,.flex,.buttons{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{margin-bottom:24px}.logo{font-size:26px;font-weight:800}.logo span,a{color:var(--blue)}.card,.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{margin:0}.stat strong{display:block;font-size:27px}.stat small,.muted{color:var(--muted)}h2{margin:0 0 16px}label{display:block;margin-bottom:5px;font-weight:600}input{width:100%;padding:11px;border-radius:8px;background:#0b1526;color:white;border:1px solid var(--border);font:inherit}input[type=checkbox]{width:auto}.field{margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:650}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--blue);color:#061321}.secondary{background:#293b55;color:white}.danger{background:#582b3a;color:white}.google{background:white;color:#222}.buttons{justify-content:flex-start}.row{border-bottom:1px solid var(--border);padding:16px 0}.row:last-child{border-bottom:0}.url{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.row a{overflow-wrap:anywhere}.hidden{display:none!important}.notice{min-height:28px;color:#86efac}.error{color:#fda4af}.chart{display:flex;align-items:flex-end;gap:8px;height:160px}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px}.bar{width:80%;max-width:42px;background:var(--blue);min-height:2px}table{border-collapse:collapse;width:100%}td{padding:8px;border-bottom:1px solid var(--border)}canvas{background:white;max-width:100%;padding:10px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr;gap:0}.card{padding:16px}}
</style></head><body><main><header><div class="logo">Robin<span>Links.</span></div><div id="account" class="buttons hidden"><span id="username" class="muted"></span><button id="logout" class="secondary">Sign out</button></div></header><section id="welcome" class="card"><h1>Free custom URL shortener</h1><p class="muted">Sign in with Google to create and track short links.</p><button id="login" class="google">Continue with Google</button></section><div id="dashboard" class="hidden"><div class="stats"><div class="stat"><strong id="totalLinks">0</strong><small>Total links</small></div><div class="stat"><strong id="totalClicks">0</strong><small>Total clicks</small></div><div class="stat"><strong id="todayClicks">—</strong><small>Clicks today (UTC)</small></div><div class="stat"><strong id="activeLinks">0</strong><small>Active links</small></div></div><section class="card"><h2 id="formTitle">Create short link</h2><form id="linkForm"><div class="field"><label for="url">Destination URL</label><input id="url" type="url" maxlength="4096" placeholder="https://example.com" required><div id="preview" class="muted"></div><div id="duplicate" class="muted"></div></div><div class="grid"><div class="field"><label for="alias">Custom alias</label><input id="alias" pattern="[A-Za-z0-9_-]{1,60}" maxlength="60" required placeholder="my-link"></div><div class="field"><label for="title">Title</label><input id="title" maxlength="100" placeholder="My website"></div><div class="field"><label for="expires">Expiration (optional)</label><input id="expires" type="datetime-local"></div><div class="field"><label for="password">Password (optional, minimum 8 characters)</label><input id="password" type="password" minlength="8" maxlength="128" placeholder="Leave blank to keep existing password"></div></div><div class="field"><label><input id="enabled" type="checkbox" checked> Enabled</label><label id="removeWrap" class="hidden"><input id="removePassword" type="checkbox"> Remove existing password</label></div><div class="buttons"><button id="save" class="primary" type="submit">Create link</button><button id="cancel" type="button" class="secondary hidden">Cancel edit</button></div></form></section><section class="card"><div class="flex"><h2>My short links</h2><button id="refresh" class="secondary">Refresh</button></div><div class="field"><input id="search" placeholder="Search your links" type="search"></div><div id="list"></div></section><section id="analytics" class="card hidden"><div class="flex"><h2 id="analyticsTitle">Analytics</h2><button id="closeAnalytics" class="secondary">Close</button></div><p id="clickSummary"></p><h3>Last 7 days (UTC)</h3><div id="chart" class="chart"></div><div class="grid"><div><h3>Devices</h3><div id="devices"></div></div><div><h3>Countries</h3><div id="countries"></div></div></div></section><section id="qrPanel" class="card hidden"><div class="flex"><h2>QR code</h2><button id="closeQR" class="secondary">Close</button></div><div style="text-align:center"><canvas id="qrCanvas"></canvas><p id="qrUrl"></p><button id="downloadQR" class="primary">Download PNG</button></div></section></div><p id="notice" class="notice" role="status"></p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{getFirestore,collection,query,where,getDocs}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
// CHANGE to your deployed Firebase Functions URL.
const API='https://asia-southeast1-link-shortener-288ce.cloudfunctions.net';
const BASE='https://ik-robin.github.io/go/s/';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);let user=null,records=[],editing=null,qrAlias=null,analyticsGeneration=0;
const short=a=>BASE+encodeURIComponent(a);const notice=(m,e=false)=>{$('notice').textContent=m;$('notice').classList.toggle('error',e)};
const validUrl=s=>{try{return ['http:','https:'].includes(new URL(s).protocol)}catch{return false}};
const date=v=>v?.toDate?v.toDate():v?new Date(v):null;
const active=r=>r.enabled!==false&&(!date(r.expiresAt)||date(r.expiresAt)>new Date());
function reset(){editing=null;$('linkForm').reset();$('enabled').checked=true;$('alias').disabled=false;$('formTitle').textContent='Create short link';$('save').textContent='Create link';$('cancel').classList.add('hidden');$('removeWrap').classList.add('hidden');$('removePassword').checked=false;$('preview').textContent='';$('duplicate').textContent=''}
async function api(name,payload){const token=await user.getIdToken();const res=await fetch(API+'/'+name,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok)throw Error(data.error||'Request failed');return data}
$('login').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){notice(e.message,true)}};$('logout').onclick=()=>signOut(auth);$('cancel').onclick=reset;$('refresh').onclick=load;
onAuthStateChanged(auth,async u=>{user=u;records=[];reset();$('welcome').classList.toggle('hidden',!!u);$('dashboard').classList.toggle('hidden',!u);$('account').classList.toggle('hidden',!u);if(u){$('username').textContent=u.displayName||u.email;await load()}else{$('list').replaceChildren();notice('')}});
async function load(){if(!user)return;const uid=user.uid;try{const snap=await getDocs(query(collection(db,'links'),where('ownerUid','==',uid)));if(user?.uid!==uid)return;records=snap.docs.map(d=>({alias:d.id,...d.data()})).sort((a,b)=>a.alias.localeCompare(b.alias));render();await loadToday(uid)}catch(e){notice('Unable to load links: '+e.message,true)}}
async function loadToday(uid){const today=new Date().toISOString().slice(0,10);let sum=0;try{await Promise.all(records.map(async r=>{const snap=await getDocs(query(collection(db,'links',r.alias,'daily'),where('date','==',today)));snap.forEach(d=>sum+=d.data().clicks||0)}));if(user?.uid===uid)$('todayClicks').textContent=sum.toLocaleString()}catch{$('todayClicks').textContent='—'}}
$('url').oninput=()=>{const value=$('url').value.trim();$('preview').textContent=validUrl(value)?'Destination domain: '+new URL(value).hostname:'';const match=records.find(r=>r.url===value&&r.alias!==editing);$('duplicate').textContent=match?'You already shortened this URL: '+short(match.alias):''};
$('linkForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const alias=$('alias').value.trim(),url=$('url').value.trim(),title=$('title').value.trim(),password=$('password').value,expiry=$('expires').value;if(!/^[A-Za-z0-9_-]{1,60}$/.test(alias)||!validUrl(url))return notice('Invalid alias or destination',true);const payload={alias,url,title,enabled:$('enabled').checked,expiresAt:expiry?new Date(expiry).toISOString():null,password};if(editing)payload.removePassword=$('removePassword').checked;$('save').disabled=true;try{await api(editing?'updateLink':'createLink',payload);reset();await load();notice('Saved: '+short(alias))}catch(e){notice(e.message,true)}finally{$('save').disabled=false}};
function btn(label,css,fn){const b=document.createElement('button');b.type='button';b.className=css;b.textContent=label;b.onclick=fn;return b}
function render(){const list=$('list');list.replaceChildren();const filter=$('search').value.toLowerCase();$('totalLinks').textContent=records.length;$('totalClicks').textContent=records.reduce((n,r)=>n+(r.clicks||0),0).toLocaleString();$('activeLinks').textContent=records.filter(active).length;const found=records.filter(r=>[r.alias,r.title||'',r.url||''].some(s=>s.toLowerCase().includes(filter)));if(!found.length){list.textContent='No links found.';return}for(const r of found){const row=document.createElement('div');row.className='row';const name=document.createElement('strong');name.textContent=r.title||r.alias;const link=document.createElement('a');link.href=short(r.alias);link.target='_blank';link.rel='noopener noreferrer';link.textContent=short(r.alias);const original=document.createElement('div');original.className='url';original.textContent=r.url;const meta=document.createElement('p');meta.className='muted';meta.textContent=`${active(r)?'Active':'Inactive'} · ${r.clicks||0} clicks${r.passwordHash?' · Password protected':''}`;const buttons=document.createElement('div');buttons.className='buttons';buttons.append(btn('Copy','secondary',async()=>{try{await navigator.clipboard.writeText(short(r.alias));notice('Copied')}catch{notice('Copy failed',true)}}),btn('QR','secondary',()=>qr(r.alias)),btn('Analytics','secondary',()=>analytics(r)),btn('Edit','secondary',()=>{editing=r.alias;$('alias').value=r.alias;$('alias').disabled=true;$('url').value=r.url;$('title').value=r.title||'';$('enabled').checked=r.enabled!==false;const d=date(r.expiresAt);$('expires').value=d?new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16):'';$('password').value='';$('removeWrap').classList.toggle('hidden',!r.passwordHash);$('formTitle').textContent='Edit short link';$('save').textContent='Save changes';$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}),btn('Delete','danger',async()=>{if(!confirm('Delete '+r.alias+' and its analytics?'))return;try{await api('deleteLink',{alias:r.alias});if(editing===r.alias)reset();await load();notice('Link deleted')}catch(e){notice(e.message,true)}}));row.append(name,document.createElement('br'),link,original,meta,buttons);list.append(row)}}$('search').oninput=render;
function qr(alias){qrAlias=alias;$('qrPanel').classList.remove('hidden');$('qrUrl').textContent=short(alias);if(typeof QRCode==='undefined')return notice('QR code library unavailable',true);QRCode.toCanvas($('qrCanvas'),short(alias),{width:280,margin:2},e=>{if(e)notice(e.message,true)});$('qrPanel').scrollIntoView({behavior:'smooth'})}$('downloadQR').onclick=()=>{if(!qrAlias)return;const a=document.createElement('a');a.href=$('qrCanvas').toDataURL('image/png');a.download=qrAlias+'-qr.png';a.click()};$('closeQR').onclick=()=>$('qrPanel').classList.add('hidden');$('closeAnalytics').onclick=()=>$('analytics').classList.add('hidden');
function counts(id,items){const el=$(id);el.replaceChildren();const entries=Object.entries(items).sort((a,b)=>b[1]-a[1]);if(!entries.length){el.textContent='No data yet';return}const table=document.createElement('table');for(const [key,count] of entries){const tr=document.createElement('tr'),k=document.createElement('td'),v=document.createElement('td');k.textContent=key;v.textContent=count;tr.append(k,v);table.append(tr)}el.append(table)}
async function analytics(r){const gen=++analyticsGeneration;$('analytics').classList.remove('hidden');$('analyticsTitle').textContent='Analytics: '+r.alias;$('clickSummary').textContent='Total clicks: '+(r.clicks||0);$('chart').textContent='Loading...';try{const snap=await getDocs(collection(db,'links',r.alias,'daily'));if(gen!==analyticsGeneration)return;const days=new Map(snap.docs.map(d=>[d.id,d.data()])),devices={},countries={};for(const d of days.values()){for(const[k,v]of Object.entries(d.devices||{}))devices[k]=(devices[k]||0)+v;for(const[k,v]of Object.entries(d.countries||{}))countries[k]=(countries[k]||0)+v}counts('devices',devices);counts('countries',countries);const chart=$('chart');chart.replaceChildren();const today=new Date();today.setUTCHours(12,0,0,0);const values=[];for(let i=6;i>=0;i--){const dt=new Date(today);dt.setUTCDate(dt.getUTCDate()-i);const key=dt.toISOString().slice(0,10);values.push({key,n:days.get(key)?.clicks||0})}const max=Math.max(1,...values.map(x=>x.n));for(const x of values){const col=document.createElement('div');col.className='barcol';const n=document.createElement('span');n.textContent=x.n;const bar=document.createElement('div');bar.className='bar';bar.style.height=Math.max(2,110*x.n/max)+'px';const label=document.createElement('span');label.textContent=x.key.slice(5);col.append(n,bar,label);chart.append(col)}$('analytics').scrollIntoView({behavior:'smooth'})}catch(e){$('chart').textContent='Unable to load analytics';notice(e.message,true)}}
</script></body></html>
